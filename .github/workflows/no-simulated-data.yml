name: CI Móvil - Calidad y Pruebas

on:
  pull_request:
  push:
    branches: [develop, qa, main, HU-INT-22-dev]

jobs:
  escaneo-y-pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Buscar datos simulados en código productivo
        working-directory: app-drivique
        run: node scripts/check-no-simulated-data.mjs
      - name: Instalar dependencias
        working-directory: app-drivique
        run: npm ci || npm install --legacy-peer-deps
      - name: Ejecutar pruebas automatizadas
        working-directory: app-drivique
        run: npm test
