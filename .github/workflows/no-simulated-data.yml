name: Sin datos simulados

on:
  pull_request:
  push:
    branches: [develop, qa, main]

jobs:
  escaneo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Buscar datos simulados en código productivo
        working-directory: app-drivique
        run: node scripts/check-no-simulated-data.mjs
