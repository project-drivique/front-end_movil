[build]
  # Carpeta base del proyecto donde se encuentra package.json
  base = "app-drivique"

  # Comando para compilar el proyecto para la web
  command = "npm run build"

  # Directorio generado que contiene los archivos estáticos listos para subir (relativo a la carpeta base)
  publish = "dist"

[build.environment]
  EXPO_PUBLIC_API_URL = "https://drivique-api.onrender.com/api/v1"
  EXPO_PUBLIC_GOOGLE_CLIENT_ID = "18960724578-h53pr526uva5mtb9doup86f5hjei231c.apps.googleusercontent.com"
  EXPO_PUBLIC_FACEBOOK_APP_ID = "1072551762252390"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
